name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upstream-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.0.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint, build, and test
        run: npm test
      - name: Assert isolated standard Pi resolution
        run: |
          node --input-type=module -e '
            for (const specifier of ["@earendil-works/pi-ai", "@earendil-works/pi-coding-agent", "@earendil-works/pi-tui"]) {
              const resolved = await import.meta.resolve(specifier);
              if (!resolved.startsWith(`file://${process.cwd()}/node_modules/`)) throw new Error(`${specifier} resolved to ${resolved}`);
              console.log(`${specifier}: ${resolved}`);
            }
          '

  fork-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Checkout and hydrate Pi ModelRuntime contract source
        run: |
          git clone --filter=blob:none https://github.com/mizuikki/pi.git ../pi
          git -C ../pi checkout --detach fd5308db5250c674f3e4cfe6059730d8f865e948
          test "$(git -C ../pi rev-parse HEAD)" = "fd5308db5250c674f3e4cfe6059730d8f865e948"
          npm ci --ignore-scripts --prefix ../pi
          npm run hydrate:model-data --prefix ../pi
      - name: Build isolated Pi tarballs and test the project copy
        run: PI_FORK_DIR=../pi PI_FORK_REF=fd5308db5250c674f3e4cfe6059730d8f865e948 npm run test:pi-fork

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify clean package installation and consumer types
        run: npm run test:package-smoke
