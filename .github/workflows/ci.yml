name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PI_EXTENSION_SDK_REF: local-fork-extension-unification
  PI_EXTENSION_SDK_API_VERSION: "1"

jobs:
  local-fork-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.0.0
          cache: npm
      - name: Check out local Pi fork
        run: |
          git clone --filter=blob:none --branch "$PI_EXTENSION_SDK_REF" https://github.com/mizuikki/pi.git ../pi
          git -C ../pi checkout --detach
      - name: Build local Pi SDK
        run: |
          npm ci --ignore-scripts --prefix ../pi
          PI_SDK_DIR=$(mktemp -d)
          node ../pi/scripts/pack-local-sdk.mjs --out "$PI_SDK_DIR" --ref "$(git -C ../pi rev-parse HEAD)"
          cp -R "$PI_SDK_DIR/pi/packages/tui/dist" ../pi/packages/tui/dist
          cp -R "$PI_SDK_DIR/pi/packages/ai/dist" ../pi/packages/ai/dist
          cp -R "$PI_SDK_DIR/pi/packages/agent/dist" ../pi/packages/agent/dist
          cp -R "$PI_SDK_DIR/pi/packages/coding-agent/dist" ../pi/packages/coding-agent/dist
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint, build, and test
        run: npm test

  fork-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Check out local Pi fork
        run: |
          git clone --filter=blob:none --branch "$PI_EXTENSION_SDK_REF" https://github.com/mizuikki/pi.git ../pi
          git -C ../pi checkout --detach
      - name: Build isolated Pi tarballs and test the project copy
        run: PI_FORK_DIR=../pi PI_FORK_REF="$(git -C ../pi rev-parse HEAD)" npm run test:pi-fork

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Check out local Pi fork
        run: |
          git clone --filter=blob:none --branch "$PI_EXTENSION_SDK_REF" https://github.com/mizuikki/pi.git ../pi
          git -C ../pi checkout --detach
      - name: Build local Pi SDK
        run: |
          npm ci --ignore-scripts --prefix ../pi
          PI_SDK_DIR=$(mktemp -d)
          node ../pi/scripts/pack-local-sdk.mjs --out "$PI_SDK_DIR" --ref "$(git -C ../pi rev-parse HEAD)"
          cp -R "$PI_SDK_DIR/pi/packages/tui/dist" ../pi/packages/tui/dist
          cp -R "$PI_SDK_DIR/pi/packages/ai/dist" ../pi/packages/ai/dist
          cp -R "$PI_SDK_DIR/pi/packages/agent/dist" ../pi/packages/agent/dist
          cp -R "$PI_SDK_DIR/pi/packages/coding-agent/dist" ../pi/packages/coding-agent/dist
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify clean package installation and consumer types
        run: PI_FORK_DIR=../pi PI_FORK_REF="$(git -C ../pi rev-parse HEAD)" npm run test:package-smoke
