name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PI_FORK_COMMIT: de0c8472c432ca6561657d20ab7b10413da62cc9

jobs:
  local-fork-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.0.0
          cache: npm
      - name: Check out local Pi fork
        run: |
          git clone --filter=blob:none --branch local-fork-extension-unification https://github.com/mizuikki/pi.git ../pi
          git -C ../pi checkout --detach "$PI_FORK_COMMIT"
      - name: Build local Pi SDK
        run: |
          npm ci --ignore-scripts --prefix ../pi
          npm run generate:models --prefix ../pi
          npm run build:offline --prefix ../pi
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint, build, and test
        run: npm test

  fork-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Check out local Pi fork
        run: |
          git clone --filter=blob:none --branch local-fork-extension-unification https://github.com/mizuikki/pi.git ../pi
          git -C ../pi checkout --detach "$PI_FORK_COMMIT"
      - name: Generate Pi model data
        run: |
          npm ci --ignore-scripts --prefix ../pi
          npm run generate:models --prefix ../pi
      - name: Build isolated Pi tarballs and test the project copy
        run: PI_FORK_DIR=../pi PI_FORK_REF="$PI_FORK_COMMIT" npm run test:pi-fork

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Check out local Pi fork
        run: |
          git clone --filter=blob:none --branch local-fork-extension-unification https://github.com/mizuikki/pi.git ../pi
          git -C ../pi checkout --detach "$PI_FORK_COMMIT"
      - name: Build local Pi SDK
        run: |
          npm ci --ignore-scripts --prefix ../pi
          npm run generate:models --prefix ../pi
          npm run build:offline --prefix ../pi
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify clean package installation and consumer types
        run: PI_FORK_DIR=../pi PI_FORK_REF="$PI_FORK_COMMIT" npm run test:package-smoke
